name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run unit tests (skip integration + API)
        run: |
          pytest tests/ -v --tb=short \
            -m "not integration" \
            --ignore=tests/integration/test_api.py \
            --cov=src --cov-report=term

      - name: Run formula integration tests
        run: |
          pytest tests/integration/test_formulas.py -v --tb=short
